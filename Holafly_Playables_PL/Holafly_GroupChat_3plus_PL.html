<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Holafly Playable · Czat grupowy</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#150D2E;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;background:#1B1236}
#top{background:#241647;padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#trow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#gpic{width:38px;height:38px;border-radius:50%;background:#FF5B6E;color:#fff;font-size:17px;text-align:center;line-height:38px;-webkit-flex-shrink:0;flex-shrink:0}
#gname{margin-left:11px}
#gname b{display:block;color:#fff;font-size:15px;font-weight:800}
#gname span{display:block;color:#8F7FC0;font-size:11px;font-weight:600;margin-top:1px}
#netbar{margin-top:9px;background:rgba(255,77,69,.16);border:1px solid rgba(255,107,107,.5);color:#FFB3AD;font-size:11.5px;font-weight:800;border-radius:9px;padding:5px 10px;text-align:center;-webkit-transition:all .4s;transition:all .4s}
#netbar.ok{background:rgba(46,230,168,.14);border-color:rgba(46,230,168,.55);color:#8FF2CD}
#chat{-webkit-flex:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 6px;position:relative}
.msg{max-width:78%;margin-bottom:9px;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.45;position:relative;opacity:0;-webkit-transform:translateY(8px);transform:translateY(8px);-webkit-transition:opacity .25s,-webkit-transform .25s;transition:opacity .25s,transform .25s;word-wrap:break-word}
.msg.in{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}
.them{background:#2C2058;color:#EDE8FA;border-bottom-left-radius:4px;float:left;clear:both}
.them .who{display:block;font-size:10.5px;font-weight:800;margin-bottom:2px}
.me{background:#FF5B6E;color:#fff;border-bottom-right-radius:4px;float:right;clear:both}
.me .st{display:block;text-align:right;font-size:10px;margin-top:3px;font-weight:700;color:rgba(255,255,255,.85)}
.me.failed{background:#5A2430}
.me.failed .st{color:#FFB3AD}
.sys{clear:both;float:none;max-width:88%;margin:6px auto 10px;background:rgba(255,255,255,.07);color:#B7A8E0;font-size:11px;font-weight:700;text-align:center;border-radius:10px;padding:6px 10px}
.typing{float:left;clear:both;background:#2C2058;border-radius:14px;border-bottom-left-radius:4px;padding:10px 14px;margin-bottom:9px;opacity:0;-webkit-transition:opacity .2s;transition:opacity .2s}
.typing.in{opacity:1}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8F7FC0;margin:0 2px;-webkit-animation:tp 1s infinite;animation:tp 1s infinite}
.typing i:nth-child(2){-webkit-animation-delay:.15s;animation-delay:.15s}
.typing i:nth-child(3){-webkit-animation-delay:.3s;animation-delay:.3s}
@-webkit-keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes tp{0%,100%{opacity:.3}50%{opacity:1}}
#dock{padding:10px 12px 16px;background:#241647;border-top:1px solid rgba(255,255,255,.08)}
#docklab{color:#8F7FC0;font-size:10.5px;font-weight:800;letter-spacing:1px;margin-bottom:8px;text-align:center}
.chip{display:block;width:100%;margin-bottom:8px;padding:12px 14px;border:0;border-radius:12px;background:#FF5B6E;box-shadow:0 3px 0 #D93A50;color:#fff;font-size:14px;font-weight:800;cursor:pointer;text-align:center}
.chip.alt{background:rgba(255,255,255,.1);box-shadow:none;color:#B7A8E0;border:1.5px solid rgba(255,255,255,.18)}
.chip.holafly{background:#2EE6A8;box-shadow:0 3px 0 #17A97A;color:#0A2A1E}
.chip:disabled{opacity:.45;pointer-events:none}
.chippulse{-webkit-animation:cp 1.3s ease-in-out infinite;animation:cp 1.3s ease-in-out infinite}
@-webkit-keyframes cp{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.03)}}
@keyframes cp{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
/* end overlay */
#endov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(21,13,46,.94);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;opacity:0;visibility:hidden;-webkit-transition:opacity .5s;transition:opacity .5s;z-index:9;padding:0 8%}
#endov.on{opacity:1;visibility:visible}
#okball{width:88px;height:88px;border-radius:50%;background:#2EE6A8;color:#0A2A1E;font-size:46px;font-weight:800;text-align:center;line-height:88px;box-shadow:0 0 44px rgba(46,230,168,.5)}
#eh{color:#fff;font-size:23px;font-weight:800;margin-top:16px;text-align:center}
#es{color:#B7A8E0;font-size:14px;font-weight:700;margin-top:7px;text-align:center;line-height:1.5}
#dl{margin-top:20px;padding:15px 44px;border:0;border-radius:16px;background:#FF5B6E;box-shadow:0 4px 0 #D93A50;color:#fff;font-size:16px;font-weight:800;letter-spacing:.8px;cursor:pointer}
#again{background:none;border:0;color:#B7A8E0;font-size:13px;font-weight:700;margin-top:12px;text-decoration:underline;cursor:pointer}
.ctapulse{-webkit-animation:ctp 1.4s ease-in-out infinite;animation:ctp 1.4s ease-in-out infinite}
@-webkit-keyframes ctp{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.06)}}
@keyframes ctp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
body.paused *{-webkit-animation-play-state:paused !important;animation-play-state:paused !important}
@media (prefers-reduced-motion:reduce){.chippulse,.ctapulse{-webkit-animation:none;animation:none}}
@media (orientation:landscape){
  .msg{font-size:12px;margin-bottom:6px;padding:6px 10px}
  .chip{padding:8px 12px;font-size:12.5px;margin-bottom:5px}
  #okball{width:64px;height:64px;line-height:64px;font-size:34px}
  #eh{font-size:18px}
}
</style>
</head>
<body class="paused"><script>if(!window.mraid){window.mraid={_l:{},getState:function(){return "default"},isViewable:function(){return true},addEventListener:function(e,f){this._l[e]=f},removeEventListener:function(){},open:function(u){window.open(u,"_blank")}};}</script>
<div id="wrap">
  <div id="top">
    <div id="trow">
      <div id="gpic">🍜</div>
      <div id="gname"><b>Ekipa z Tokio 🇯🇵</b><span id="gsub">Maya, Leo, Sofia +2</span></div>
    </div>
    <div id="netbar">&#9888;&#65039; Brak internetu &middot; Roaming 15 €/MB</div>
  </div>
  <div id="chat"></div>
  <div id="dock">
    <div id="docklab">STUKNIJ, ABY ODPOWIEDZIEĆ</div>
    <div id="chips"></div>
  </div>
</div>
<div id="endov">
  <div id="okball">&#10003;</div>
  <div id="eh">Nie przegap żadnej chwili</div>
  <div id="es">Internet bez limitu w 270+ kierunkach. Połączenie od chwili lądowania, roaming za &euro;0.</div>
  <button id="dl" class="ctapulse">POBIERZ HOLAFLY</button>
  <button id="again">powtórz lądowanie &#8635;</button>
</div>
<script>
(function(){
"use strict";
var STORE_URLS={Android:"https://play.google.com/store/apps/details?id=com.holafly.holafly",iOS:"https://apps.apple.com/us/app/holafly-esim-unlimited-data/id1629600786"};
var IS_IOS=/iP(hone|od|ad)/.test(navigator.userAgent);
var started=false,doneUp=false,AC=null,timers=[],stage=0,connected=false;

function T(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){var i;for(i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}

function openStore(){var u=IS_IOS?STORE_URLS.iOS:STORE_URLS.Android;if(window.mraid&&mraid.open){mraid.open(u);}}

function snd(kind){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    if(!AC)AC=new Ctx();
    if(AC.state==="suspended"&&AC.resume)AC.resume();
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";
    o.frequency.value=kind==="pop"?740:kind==="fail"?220:kind==="send"?600:880;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(kind==="fail"?0.14:0.09,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="fail"?0.3:0.13));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.35);
  }catch(e){}
}

var chat=document.getElementById("chat");
var WHO_COLORS={"Maya":"#FFC542","Leo":"#2EE6A8","Sofia":"#7FB3FF"};
function scrollBottom(){chat.scrollTop=chat.scrollHeight+500;}
function addThem(who,txt,delay){
  T(function(){
    var d=document.createElement("div");
    d.className="msg them";
    d.innerHTML='<span class="who" style="color:'+(WHO_COLORS[who]||"#FFC542")+'">'+who+'</span>'+txt;
    chat.appendChild(d);
    setTimeout(function(){d.className="msg them in";},30);
    snd("pop");scrollBottom();
  },delay);
}
function addSys(txt,delay){
  T(function(){
    var d=document.createElement("div");
    d.className="msg sys in";
    d.innerHTML=txt;
    chat.appendChild(d);scrollBottom();
  },delay);
}
function addMe(txt,willFail,cb){
  var d=document.createElement("div");
  d.className="msg me";
  d.innerHTML=txt+'<span class="st">&#128337; wysyłanie...</span>';
  chat.appendChild(d);
  setTimeout(function(){d.className="msg me in";},30);
  snd("send");scrollBottom();
  T(function(){
    var st=d.querySelector(".st");
    if(willFail){
      d.className="msg me in failed";
      st.innerHTML="&#10060; Nie dostarczono &middot; brak połączenia";
      snd("fail");
    }else{
      st.innerHTML="&#10003;&#10003; Dostarczono";
      snd("pop");
    }
    if(cb)cb();
  },willFail?1400:700);
}
function typing(delay,dur){
  T(function(){
    var d=document.createElement("div");
    d.className="typing";
    d.innerHTML="<i></i><i></i><i></i>";
    chat.appendChild(d);
    setTimeout(function(){d.className="typing in";},30);
    scrollBottom();
    T(function(){if(d.parentNode)d.parentNode.removeChild(d);},dur);
  },delay);
}

function setChips(list){
  var c=document.getElementById("chips");c.innerHTML="";
  var i;
  for(i=0;i<list.length;i++){
    var b=document.createElement("button");
    b.className="chip"+(list[i].cls?" "+list[i].cls:"");
    b.innerHTML=list[i].t;
    b.setAttribute("data-a",list[i].a);
    b.addEventListener("click",onChip,false);
    c.appendChild(b);
  }
}
function onChip(ev){
  if(!started||doneUp)return;
  var a=ev.currentTarget.getAttribute("data-a");
  setChips([]);
  if(a==="reply1"){
    addMe("Już po lądowaniu!! lecę do was 🏃",true,function(){
      addSys("Nie udało się wysłać wiadomości. Brak połączenia z internetem.",300);
      T(function(){
        setChips([{t:"Spróbuj jeszcze raz 🔄",a:"reply2"},{t:"Znajdę gdzieś WiFi 😩",a:"reply2",cls:"alt"}]);
      },900);
    });
  }else if(a==="reply2"){
    addMe("Ej, poczekajcie na mnie!! 🙏",true,function(){
      addSys("Nadal brak połączenia. Roaming kosztowałby 15 €/MB.",300);
      typing(900,1400);
      addThem("Maya","to co, zamawiamy bez czekania? 😅",2400);
      T(function(){
        setChips([{t:"&#9889; Aktywuj eSIM Holafly",a:"holafly",cls:"holafly chippulse"}]);
      },2900);
    });
  }else if(a==="holafly"){
    connected=true;
    var nb=document.getElementById("netbar");
    nb.className="ok";
    nb.innerHTML="&#128246; eSIM Holafly aktywny &middot; Internet bez limitu &middot; Roaming za &euro;0";
    snd("pop");
    addSys("&#9889; eSIM Holafly aktywowany. Połączenie w 3 sekundy.",300);
    T(function(){
      addMe("JESTEM!! stolik dla 6 osób 😤🍜",false,function(){
        typing(500,1100);
        addThem("Leo","EJJJ żyjesz 😂🎉",1700);
        addThem("Sofia","jesteśmy z tyłu, chodź!! 🙌",2600);
        addThem("Maya","zamawiam ci ten ostry 🌶️",3500);
        T(finish,4700);
      });
    },800);
  }
}

function finish(){
  doneUp=true;
  document.getElementById("endov").className="on";
  snd("pop");
}
function again(){
  doneUp=false;stage=0;connected=false;
  clearTimers();
  document.getElementById("endov").className="";
  chat.innerHTML="";
  var nb=document.getElementById("netbar");
  nb.className="";
  nb.innerHTML="&#9888;&#65039; Brak internetu &middot; Roaming 15 €/MB";
  opening();
}

function opening(){
  addSys("&#9992;&#65039; Właśnie lądujesz w Tokio",200);
  addThem("Maya","już po lądowaniu?? jesteśmy w ramenowni 🍜",900);
  addThem("Leo","szybko, kolejka jest MASAKRYCZNA 😳",2100);
  typing(3000,1200);
  addThem("Sofia","wysyłam ci pinezkę 📍",4400);
  T(function(){
    setChips([{t:"Już po lądowaniu!! lecę do was 🏃",a:"reply1"},{t:"Poczekajcie na mnie!! 🙏",a:"reply1",cls:"alt"}]);
  },5000);
}

function bind(){
  document.getElementById("dl").addEventListener("click",openStore,false);
  document.getElementById("again").addEventListener("click",again,false);
}

function showAd(){started=true;document.body.className="";opening();}
function resumeAd(){document.body.className="";if(AC&&AC.resume)AC.resume();}
function pauseAd(){document.body.className="paused";if(AC&&AC.suspend)AC.suspend();}

function onViewableChange(v){if(v){started?resumeAd():showAd();}else{pauseAd();}}
function onSdkReady(){mraid.addEventListener("viewableChange",onViewableChange);if(mraid.isViewable())showAd();}
function start(){
  bind();
  if(window.mraid){
    if(mraid.getState()==="loading"){mraid.addEventListener("ready",onSdkReady);}
    else{onSdkReady();}
  }
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){pauseAd();}
  else if(!window.mraid||mraid.isViewable()){if(started)resumeAd();}
},false);
start();
})();
</script>
<div style="position:fixed;bottom:6px;left:50%;z-index:999;pointer-events:none;transform:translateX(-50%);-webkit-transform:translateX(-50%);font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.85);background:rgba(20,15,40,.55);padding:5px 14px;border-radius:10px;white-space:nowrap">UNITY ADS &middot; CONCEPT</div></body>
</html>
